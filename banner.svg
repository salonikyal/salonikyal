<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" width="100%">
  <defs>

    <linearGradient id="bgGrad"
                    x1="0" y1="0"
                    x2="900" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0B1120"/>
      <stop offset="28%" stop-color="#1E1B4B"/>
      <stop offset="52%" stop-color="#6D28D9"/>
      <stop offset="76%" stop-color="#FF206E"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <linearGradient id="bridgeGrad"
                    x1="150" y1="0"
                    x2="750" y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#7DD3FC"/>
      <stop offset="50%" stop-color="#FFD23F"/>
      <stop offset="100%" stop-color="#FF6B35"/>
    </linearGradient>

    <pattern id="pL"
             width="40"
             height="40"
             patternUnits="userSpaceOnUse">
      <path d="M0 20 H40 M20 0 V40"
            stroke="#7DD3FC"
            stroke-width="1"/>
      <circle cx="20" cy="20" r="2" fill="#7DD3FC"/>
    </pattern>

    <pattern id="pR"
             width="50"
             height="50"
             patternUnits="userSpaceOnUse">
      <circle cx="25" cy="25" r="2" fill="#FFD23F"/>
      <circle cx="37" cy="25" r="1.5" fill="#FFD23F"/>
      <circle cx="31" cy="35" r="1.5" fill="#FFD23F"/>
      <circle cx="19" cy="35" r="1.5" fill="#FFD23F"/>
      <circle cx="13" cy="25" r="1.5" fill="#FFD23F"/>
      <circle cx="19" cy="15" r="1.5" fill="#FFD23F"/>
      <circle cx="31" cy="15" r="1.5" fill="#FFD23F"/>
    </pattern>


    <!-- ============================================= -->
    <!-- TYPEWRITER CLIPS                              -->
    <!-- ============================================= -->

    <clipPath id="clip0">
      <rect x="219.0"
            y="67.7"
            width="0"
            height="49.4">

        <animate
          attributeName="width"
          dur="14s"
          repeatCount="indefinite"
          keyTimes="0.0;0.174354;0.321956;0.338561;1.0"
          values="0;475.2;475.2;409.2;409.2"/>

      </rect>
    </clipPath>


    <clipPath id="clip1">
      <rect x="219.0"
            y="67.7"
            width="0"
            height="49.4">

        <animate
          attributeName="width"
          dur="14s"
          repeatCount="indefinite"
          keyTimes="0.0;0.338561;0.363469;0.51107;0.52214;1.0"
          values="409.2;409.2;475.2;475.2;431.2;431.2"/>

      </rect>
    </clipPath>


    <clipPath id="clip2">
      <rect x="219.0"
            y="67.7"
            width="0"
            height="49.4">

        <animate
          attributeName="width"
          dur="14s"
          repeatCount="indefinite"
          keyTimes="0.0;0.52214;0.538745;1.0"
          values="431.2;431.2;475.2;475.2"/>

      </rect>
    </clipPath>

  </defs>


  <!-- ============================================= -->
  <!-- BACKGROUND                                    -->
  <!-- ============================================= -->

  <rect x="0"
        y="0"
        width="900"
        height="280"
        fill="url(#bgGrad)"/>

  <rect x="0"
        y="0"
        width="378.0"
        height="280"
        fill="url(#pL)"
        opacity="0.12"/>

  <rect x="522.0"
        y="0"
        width="378.0"
        height="280"
        fill="url(#pR)"
        opacity="0.12"/>


  <!-- ============================================= -->
  <!-- DECORATIONS                                   -->
  <!-- ============================================= -->

  <text x="40"
        y="50"
        font-family="Consolas, Menlo, monospace"
        font-size="24"
        font-weight="bold"
        fill="#7DD3FC"
        opacity="0.8">&lt;/&gt;</text>

  <ellipse cx="855"
           cy="50"
           rx="15"
           ry="5.5"
           fill="none"
           stroke="#FFD23F"
           stroke-width="2"
           opacity="0.8"/>

  <path d="M855 27
           C850 34 850 42 855 45
           C860 42 860 34 855 27 Z"
        fill="#FFD23F"
        opacity="0.85"/>


  <!-- ============================================= -->
  <!-- SALUNI                                         -->
  <!-- ============================================= -->

  <g clip-path="url(#clip0)" opacity="1">

    <text x="219.0"
          y="100"
          font-family="'Courier New', Courier, monospace"
          font-size="38"
          font-weight="bold"
          fill="#FFF8E7"
          textLength="462"
          lengthAdjust="spacingAndGlyphs">
      Hi there, I am Saluni
    </text>

    <animate
      attributeName="opacity"
      dur="14s"
      repeatCount="indefinite"
      keyTimes="0;0.338561;0.338561;1"
      values="1;1;0;0"/>

  </g>


  <!-- ============================================= -->
  <!-- SALOMI                                         -->
  <!-- ============================================= -->

  <g clip-path="url(#clip1)" opacity="0">

    <text x="219.0"
          y="100"
          font-family="'Courier New', Courier, monospace"
          font-size="38"
          font-weight="bold"
          fill="#FFF8E7"
          textLength="462"
          lengthAdjust="spacingAndGlyphs">
      Hi there, I am Salomi
    </text>

    <animate
      attributeName="opacity"
      dur="14s"
      repeatCount="indefinite"
      keyTimes="0;0.338561;0.338561;0.52214;0.52214;1"
      values="0;0;1;1;0;0"/>

  </g>


  <!-- ============================================= -->
  <!-- SALONI                                         -->
  <!-- ============================================= -->

  <g clip-path="url(#clip2)" opacity="0">

    <text x="219.0"
          y="100"
          font-family="'Courier New', Courier, monospace"
          font-size="38"
          font-weight="bold"
          fill="#FFF8E7"
          textLength="462"
          lengthAdjust="spacingAndGlyphs">
      Hi there, I am Saloni.
    </text>

    <animate
      attributeName="opacity"
      dur="14s"
      repeatCount="indefinite"
      keyTimes="0;0.52214;0.52214;1"
      values="0;0;1;1"/>

  </g>


  <!-- ============================================= -->
  <!-- CURSOR                                         -->
  <!-- ============================================= -->

  <rect x="219.0"
        y="69.6"
        width="3"
        height="39.9"
        fill="#FFD23F">

    <animate
      attributeName="x"
      dur="14s"
      repeatCount="indefinite"
      keyTimes="
        0.0;
        0.174354;
        0.321956;
        0.338561;
        0.338561;
        0.363469;
        0.51107;
        0.52214;
        0.52214;
        0.538745;
        1.0"
      values="
        219.0;
        694.2;
        694.2;
        628.2;
        628.2;
        694.2;
        694.2;
        650.2;
        650.2;
        694.2;
        694.2"/>

    <animate
      attributeName="opacity"
      dur="6s"
      repeatCount="indefinite"
      keyTimes="0;0.5;1"
      values="1;0;1"/>

  </rect>


  <!-- ============================================= -->
  <!-- SUBTITLE                                       -->
  <!-- ============================================= -->

  <text x="450.0"
        y="140"
        text-anchor="middle"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="15"
        fill="#FFF3D6"
        opacity="0.75"
        letter-spacing="1">
    Technical Lead · Full-Stack Developer · Intercultural connector.
  </text>


  <!-- ============================================= -->
  <!-- BRIDGE                                         -->
  <!-- ============================================= -->

  <line x1="150"
        y1="255"
        x2="150"
        y2="270"
        stroke="#94A3B8"
        stroke-width="3"/>

  <line x1="750"
        y1="255"
        x2="750"
        y2="270"
        stroke="#94A3B8"
        stroke-width="3"/>

  <path d="M150,255
           Q450.0,150 750,255"
        fill="none"
        stroke="url(#bridgeGrad)"
        stroke-width="4"
        stroke-linecap="round"/>


  <!-- BRIDGE CABLES -->

  <line x1="250"
        y1="226"
        x2="250"
        y2="262"
        stroke="#7DD3FC"
        stroke-width="1.5"
        opacity="0.6"/>

  <circle cx="250"
          cy="262"
          r="3"
          fill="#7DD3FC"/>

  <line x1="350"
        y1="208"
        x2="350"
        y2="262"
        stroke="#A78BFA"
        stroke-width="1.5"
        opacity="0.6"/>

  <circle cx="350"
          cy="262"
          r="3"
          fill="#A78BFA"/>

  <line x1="450.0"
        y1="203"
        x2="450.0"
        y2="262"
        stroke="#FFD23F"
        stroke-width="1.5"
        opacity="0.6"/>

  <circle cx="450.0"
          cy="262"
          r="3"
          fill="#FFD23F"/>

  <line x1="550"
        y1="208"
        x2="550"
        y2="262"
        stroke="#FF6FA8"
        stroke-width="1.5"
        opacity="0.6"/>

  <circle cx="550"
          cy="262"
          r="3"
          fill="#FF6FA8"/>

  <line x1="650"
        y1="226"
        x2="650"
        y2="262"
        stroke="#FF6B35"
        stroke-width="1.5"
        opacity="0.6"/>

  <circle cx="650"
          cy="262"
          r="3"
          fill="#FF6B35"/>

</svg>